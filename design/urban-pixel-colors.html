<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idleness — Urban Pixel Color Schemes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 26px;
      background: #0a0a0d;
      color: #d8d8e0;
      font-family: "Pixelify Sans", "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .page-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 4px solid #24242c;
    }

    .page-head h1 {
      margin: 0;
      font-family: "Jersey 10", monospace;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .page-head p {
      margin: 0;
      color: #8f8f9e;
      font-size: 12px;
      max-width: 700px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(730px, 1fr));
      gap: 26px;
      align-items: start;
    }

    .variant {
      background: var(--panel);
      border: 4px solid var(--frame);
      box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.55);
      color: var(--text);
    }

    .variant-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 10px;
      background: var(--title);
      color: var(--title-text);
      border-bottom: 4px solid var(--frame);
      font-family: "Jersey 10", monospace;
      font-size: 18px;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .label-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Pixelify Sans", sans-serif;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .chips { display: flex; gap: 3px; }

    .chips span {
      width: 12px;
      height: 12px;
      border: 2px solid var(--frame);
      display: block;
    }

    /* ---------- Urban stage ---------- */
    .stage {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 0.92fr 1.1fr;
      grid-template-rows: auto auto;
      gap: 11px;
      padding: 15px;
      min-height: 500px;
      overflow: hidden;
      background: var(--scene-sky);
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.55;
      pointer-events: none;
    }

    .stage > .panel { position: relative; z-index: 1; }

    /* ---------- Panel ---------- */
    .panel {
      background: var(--panel);
      border: 4px solid var(--frame);
      filter: drop-shadow(5px 5px 0 rgba(0, 0, 0, 0.45));
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 6px 3px;
      background: var(--title);
      color: var(--title-text);
      border-bottom: 3px solid var(--frame);
      font-family: "Jersey 10", monospace;
      font-size: 19px;
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .panel-title .x {
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      background: var(--panel);
      border: 2px solid var(--frame);
      color: var(--text);
      font-family: "VT323", monospace;
      font-size: 14px;
      line-height: 1;
      box-shadow: inset 1px 1px 0 var(--slot-light), inset -1px -1px 0 var(--slot-dark);
    }

    .panel-body {
      padding: 8px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    /* ---------- Slots ---------- */
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
    }

    .slot-grid.equip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .slot-grid.craft { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .slot {
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      background: var(--slot);
      border: 2px solid var(--frame);
      box-shadow: inset 2px 2px 0 var(--slot-light), inset -2px -2px 0 var(--slot-dark);
      min-width: 0;
    }

    .slot svg { width: 78%; height: 78%; shape-rendering: crispEdges; }
    .slot.big svg { width: 66%; height: 66%; }

    /* ---------- Craft ---------- */
    .craft-row {
      display: grid;
      grid-template-columns: 1fr auto 0.8fr;
      gap: 6px;
      align-items: center;
    }

    .craft-arrow {
      font-family: "Jersey 10", monospace;
      font-size: 22px;
      color: var(--accent);
      line-height: 1;
    }

    .create-btn { justify-self: start; margin-top: 2px; }

    /* ---------- Stats ---------- */
    .stat-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-family: "VT323", monospace;
      font-size: 17px;
      line-height: 1.05;
      color: var(--muted);
      border-bottom: 2px dotted var(--slot-dark);
      padding-bottom: 1px;
    }

    .stat-line b { color: var(--text); font-weight: 400; }

    /* ---------- Inventory ---------- */
    .inv { align-self: start; }

    .currency-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "VT323", monospace;
      font-size: 18px;
      color: var(--text);
      padding-top: 2px;
    }

    .currency { display: flex; align-items: center; gap: 4px; }
    .currency svg { width: 18px; height: 18px; shape-rendering: crispEdges; }

    /* ---------- Result ---------- */
    .result {
      grid-column: 1 / span 2;
      grid-row: 2;
      align-self: stretch;
    }

    .result .panel-body {
      place-items: center;
      text-align: center;
      gap: 4px;
      padding: 10px;
    }

    .stars { display: flex; gap: 4px; }
    .stars svg { width: 34px; height: 34px; shape-rendering: crispEdges; }

    .result-title {
      font-family: "Jersey 10", monospace;
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0.05em;
      color: var(--text);
      text-transform: uppercase;
    }

    .result-sub {
      font-family: "VT323", monospace;
      font-size: 16px;
      color: var(--muted);
      line-height: 1;
    }

    .result-actions { display: flex; gap: 8px; margin-top: 4px; }

    /* ---------- Buttons ---------- */
    .pixel-btn {
      border: 3px solid var(--frame);
      background: var(--accent);
      color: var(--accent-text);
      font-family: "Jersey 10", monospace;
      font-size: 18px;
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 5px 12px 3px;
      cursor: pointer;
      box-shadow:
        inset 2px 2px 0 rgba(255, 255, 255, 0.3),
        inset -2px -2px 0 rgba(0, 0, 0, 0.28),
        3px 3px 0 var(--frame);
    }

    .pixel-btn.alt { background: var(--panel-2); color: var(--text); }

    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow:
        inset 2px 2px 0 rgba(255, 255, 255, 0.3),
        inset -2px -2px 0 rgba(0, 0, 0, 0.28),
        1px 1px 0 var(--frame);
    }

    @media (max-width: 780px) {
      body { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
      .stage { grid-template-columns: 1fr 1fr; }
      .inv { grid-column: 1 / span 2; }
      .result { grid-column: 1 / span 2; grid-row: auto; }
    }
  </style>
</head>
<body>

    <p>

    const mock = () => `
